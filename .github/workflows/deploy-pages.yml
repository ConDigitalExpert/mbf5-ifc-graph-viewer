name: Deploy BIM viewer to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out viewer
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Verify viewer and policy regressions
        run: |
          npm run typecheck
          npm run test:jev
          npm run test:viewer
          npm run test:ui-contract
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Package static viewer
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
